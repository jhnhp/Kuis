<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Nalarin Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb; --surface:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#4f46e5; --brand-ink:#fff; --brand-soft:#eef2ff; --bad:#e11d48; --bad-soft:#fff1f2;
  --font:'Figtree',system-ui,sans-serif; --display:'Bricolage Grotesque','Figtree',sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#131a2e; --ink:#e8ecf8; --muted:#94a0bd; --line:#263050;
  --brand:#a5b4fc; --brand-ink:#1e1b4b; --brand-soft:#212a55; --bad:#fb7185; --bad-soft:#3b1a25;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:radial-gradient(circle at 10% 0%,rgba(99,102,241,.08),transparent 30rem),var(--bg);
  color:var(--ink);line-height:1.5;min-height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
header{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:10}
.bar{max-width:1080px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 8px 20px rgba(79,70,229,.2);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;flex:none}
.bar b{font-family:var(--display);font-size:17px;flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}
main{flex:1;width:100%;max-width:1080px;margin:auto;padding:28px 16px 40px}
h1{font-family:var(--display);font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:22px}
.search{width:100%;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:thin}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.chip small{color:var(--muted);font-weight:600;margin-left:4px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.on small{color:inherit;opacity:.8}
section{margin-top:26px}
h2{font-family:var(--display);font-size:21px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--font);font-size:13px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:20px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;
  transition:border-color .15s,transform .1s,box-shadow .15s}
.card:hover{border-color:var(--brand);box-shadow:0 10px 28px rgba(79,70,229,.1)}
.card:active{transform:scale(.99)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px}
.crumbs span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.ctitle{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25}
.cmeta{color:var(--muted);font-size:14px;flex:1}
.go{font-weight:700;font-size:14px;color:var(--brand);margin-top:4px}
.note{padding:16px;border-radius:14px;margin-top:18px;background:var(--bad-soft);color:var(--bad);font-size:15px}
.note code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:6px}
.empty{margin-top:30px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
@media (max-width:520px){main{padding-top:20px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">N</div><b>Nalarin Quiz</b>
  <button class="icon-btn" id="theme" aria-label="Ganti tema terang/gelap">◐</button>
</div></header>

<main>
  <h1>Pilih kuis</h1>
  <p class="lead">Pilih mata pelajaran, lalu ketuk kuis yang ingin dikerjakan.</p>
  <input class="search" id="q" type="search" placeholder="Cari kuis, mata pelajaran, atau kelas…" aria-label="Cari kuis">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <p class="empty hidden" id="empty">Tidak ada kuis yang cocok dengan pencarianmu.</p>
  <div class="note hidden" id="err"></div>
</main>

<footer><span id="stamp"></span>Dibuat oleh Johan Herdi Putra, 2026</footer>

<script>
const $ = id => document.getElementById(id);
let all = [], active = 'Semua';

(function(){
  let t = null; try{ t = localStorage.getItem('nalarin:theme'); }catch(e){}
  if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('nalarin:theme', t); }catch(e){}
};

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

function drawChips(){
  const box = $('chips'); box.innerHTML = '';
  const counts = {};
  all.forEach(k => counts[k.mapel] = (counts[k.mapel] || 0) + 1);
  ['Semua', ...Object.keys(counts).sort((a, b) => a.localeCompare(b, 'id'))].forEach(m => {
    const b = el('button', 'chip' + (m === active ? ' on' : ''), m);
    b.appendChild(el('small', '', m === 'Semua' ? all.length : counts[m]));
    b.onclick = () => { active = m; drawChips(); render(); };
    box.appendChild(b);
  });
}

function render(){
  const term = $('q').value.trim().toLowerCase();
  const list = all.filter(k =>
    (active === 'Semua' || k.mapel === active) &&
    (!term || [k.title, k.topic, k.mapel, ...(k.sub || [])].join(' ').toLowerCase().includes(term)));
  const box = $('list'); box.innerHTML = '';
  $('empty').classList.toggle('hidden', list.length > 0);
  const groups = new Map();
  list.forEach(k => { if(!groups.has(k.mapel)) groups.set(k.mapel, []); groups.get(k.mapel).push(k); });
  [...groups.keys()].sort((a, b) => a.localeCompare(b, 'id')).forEach(m => {
    const items = groups.get(m);
    const sec = el('section'), h = el('h2', '', m);
    h.appendChild(el('small', '', items.length + ' kuis'));
    sec.appendChild(h);
    const grid = el('div', 'grid');
    items.forEach(k => {
      const a = el('a', 'card'); a.href = encodeURI(k.url);
      if(k.sub && k.sub.length){ const c = el('div', 'crumbs'); k.sub.forEach(s => c.appendChild(el('span', '', s))); a.appendChild(c); }
      a.appendChild(el('div', 'ctitle', k.title));
      const meta = [k.topic && k.topic !== k.title ? k.topic : '', k.questions ? k.questions + ' soal' : ''].filter(Boolean).join(' · ');
      a.appendChild(el('div', 'cmeta', meta));
      a.appendChild(el('div', 'go', 'Mulai mengerjakan'));
      grid.appendChild(a);
    });
    sec.appendChild(grid); box.appendChild(sec);
  });
}

$('q').addEventListener('input', render);

fetch('daftar.json', {cache: 'no-cache'})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    all = d.kuis || [];
    if(!all.length) throw new Error('kosong');
    drawChips(); render();
    const t = d.generated && new Date(d.generated);
    if(t && !isNaN(t)) $('stamp').textContent = 'Daftar diperbarui ' + t.toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'}) + ' · ';
  })
  .catch(() => {
    $('q').classList.add('hidden');
    const e = $('err'); e.classList.remove('hidden');
    e.innerHTML = 'Daftar kuis belum bisa dimuat. Jalankan <code>python3 buat-daftar.py</code> di folder ini, lalu buka halaman ini lewat server (bukan langsung dari file).';
  });
</script>
</body>
</html>
